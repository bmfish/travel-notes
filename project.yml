name: TravelNotes
options:
  bundleIdPrefix: com.bmfish
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: "Y8L223H5F9"
    ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
    PRODUCT_NAME: "$(TARGET_NAME)"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
    SUPPORTS_MACCATALYST: YES
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  TravelNotes:
    type: application
    platform: iOS
    sources:
      - path: TravelNotes
    info:
      path: TravelNotes/Info.plist
      properties:
        CFBundleDisplayName: 高铁笔记
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsWriteOnlyAccessUsageDescription: "把车票行程添加到你的日历,出发前 2 小时提醒"
        NSCalendarsFullAccessUsageDescription: "把车票行程添加到你的日历,出发前 2 小时提醒"
